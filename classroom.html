    <button class="register interactive-object" id="register">
      <div class="book-cover"><div class="book-title">CLASS<br>REGISTER</div><div class="book-year">2026</div></div>

      <span class="object-label">Our Notes</span>
    </button>



    <div class="floor"></div>
    <div class="plant-large"><i></i><i></i><i></i><div class="pot"></div></div>
  </section>
</div>

window.NOTES = [["Aaryan Sharma", "Some teachers teach lessons, but a few become a part of our memories forever. You are truly one of those rare teachers.\n\nThank you for believing in us, guiding us, and always making us feel understood. I’ll always appreciate you and remember you—not just as a wonderful teacher, but as the teacher who was born in Iran. ❤️"], ["Samrat", "Happy Teachers’ Day to the one who makes every reaction worth remembering (except the fact that I don't remember anything).Thank you for always making Chemistry easier and actually interesting for us. You’ve always been there to clear our doubts and your way of teaching makes every class more fun and something we actually look forward to and thank you for giving us random PT periodsss"], ["Tejas Tiwari", "Dear Madam,\nThank you for being more than just a teacher. You have guided me, encouraged me, and believed in me even when I doubted myself. Your patience, kindness, and dedication have made learning a beautiful experience."], ["Ahmed Ayan", "Dear Renu Ma’am,\nI want to wish you a very Happy Teacher’s Day. Thank you for always teaching us with patience and helping us whenever we have any doubts. I really appreciate the way you explain everything and encourage us to do our best. You have taught me many things, not only related to studies but also about being a better person. I am really thankful to have you as my teacher. Thank you for all your hard work and support. Happy Teacher’s Day once again, Renu Ma’am!"], ["Rishit", "Dear Ma’am,\nWishing you a very Happy Teacher’s Day! Thank you for always guiding and supporting us with patience and kindness. Your way of teaching makes even chemistry a little more interesting.\nGrateful to have you as our teacher.\n\nWarm regards,\nRishit"], ["Manu", "Thank you for always teaching us with patience and encouraging us to do our best. I’m really grateful to have a teacher like you. Your support and kindness mean a lot to me. Wishing you a very Happy Teacher’s Day, Renu Ma’am"], ["Raghav", "Renu ma’am is hands down the coolest teacher you could ever ask for. Instead of hitting us with standard lectures, she keeps things relaxed, jokes around and actually listens to what we have to say like a real friend. She just gets us, making her class the one room in the whole building where everyone actually wants to be."], ["Prakhar", "Happy Teachers’ Day, Ma’am! 🌷❤️\n\nThank you for being not just an amazing Chemistry teacher, but also a wonderful class teacher. Your patience, guidance, and constant support mean a lot to me.\n\nI’m truly grateful to have you as my teacher. Thank you for making school a little more special. ❤️\n\n— Prakhar ✨"], ["Vivan", "Happy Teacher’s Day, Renu Ma’am! 🌷\nThank you for always supporting us, understanding us, and making Chemistry easier and more enjoyable. Truly grateful to have you as my teacher. ❤️\n\n— Vivan"], ["Devansh", "Happy Teacher’s Day, Ma’am! ❤️\nThank you for your patience, guidance, and for always helping us whenever we need it. Your classes are always something to look forward to!\n\n— Devansh"], ["Madhavan", "Happy Teacher’s Day, Renu Ma’am! 🌷\nThank you for always believing in us and making every Chemistry class more interesting. We’re lucky to have a teacher like you! ❤️\n\n— Madhavan"], ["Pradyush Soni", "Happy Teacher’s Day, Renu Ma’am! 🌷❤️\nThank you for always being so supportive, patient, and understanding. You make Chemistry easier and every class more enjoyable. Truly grateful to have you as our teacher!\n\n— Pradyush Soni ✨"], ["Ananya", "Happy Teacher’s Day, Renu Ma’am! 🌷❤️\nThank you for always being so patient, supportive, and understanding with us. You make Chemistry easier, your classes more enjoyable, and you always encourage us to do our best. I’m truly grateful to have you as my teacher. Thank you for everything, Ma’am! ❤️\n\n— Ananya ✨"]];
